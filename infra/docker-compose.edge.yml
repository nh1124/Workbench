# Edge stack: the Cloudflare tunnel that publishes Core. Started explicitly with
# -f by infra/start_tunnel.{sh,bat}; it is never picked up by default discovery.
#
# The database/service stack is the separate root docker-compose.yml.
services:
  # Cloudflare Tunnel
  tunnel:
    profiles:
      - edge
    image: cloudflare/cloudflared:latest
    container_name: workbench-tunnel
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ${EDGE_ENV_FILE:-../.env.edge}
