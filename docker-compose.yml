services:
  workbench-core-db:
    image: postgres:16-alpine
    container_name: workbench-core-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: workbench_core_db
      POSTGRES_USER: workbench_user
      POSTGRES_PASSWORD: workbench_pass
    ports:
      - "5542:5432"
    volumes:
      - workbench_core_pgdata:/var/lib/postgresql/data

  notes-db:
    image: postgres:16-alpine
    container_name: workbench-notes-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: notes_db
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: notes_pass
    ports:
      - "5543:5432"
    volumes:
      - notes_pgdata:/var/lib/postgresql/data

  artifacts-db:
    image: postgres:16-alpine
    container_name: workbench-artifacts-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: artifacts_db
      POSTGRES_USER: artifacts_user
      POSTGRES_PASSWORD: artifacts_pass
    ports:
      - "5544:5432"
    volumes:
      - artifacts_pgdata:/var/lib/postgresql/data

  artifacts:
    build:
      context: .
      dockerfile: services/artifacts/Dockerfile
    container_name: workbench-artifacts-service
    restart: unless-stopped
    depends_on:
      - artifacts-db
    environment:
      ARTIFACTS_SERVICE_HOST: 0.0.0.0
      ARTIFACTS_SERVICE_PORT: 4102
      ARTIFACTS_DB_HOST: artifacts-db
      ARTIFACTS_DB_PORT: 5432
      ARTIFACTS_DB_NAME: artifacts_db
      ARTIFACTS_DB_USER: artifacts_user
      ARTIFACTS_DB_PASSWORD: artifacts_pass
      JWT_SECRET: change-this-workbench-jwt-secret
      JWT_ISSUER: workbench-core
      INTERNAL_API_KEY: workbench-internal-artifacts
      # Optional override (already defaulted in Dockerfile)
      ARTIFACTS_OFFICE_CONVERTER_CMD: /usr/bin/soffice
    ports:
      - "4102:4102"
    volumes:
      - artifacts_storage:/app/services/artifacts/storage

  tasks-db:
    image: postgres:16-alpine
    container_name: workbench-tasks-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasks_db
      POSTGRES_USER: tasks_user
      POSTGRES_PASSWORD: tasks_pass
    ports:
      - "5545:5432"
    volumes:
      - tasks_pgdata:/var/lib/postgresql/data

  projects-db:
    image: postgres:16-alpine
    container_name: workbench-projects-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: projects_db
      POSTGRES_USER: projects_user
      POSTGRES_PASSWORD: projects_pass
    ports:
      - "5546:5432"
    volumes:
      - projects_pgdata:/var/lib/postgresql/data

volumes:
  workbench_core_pgdata:
  notes_pgdata:
  artifacts_pgdata:
  artifacts_storage:
  tasks_pgdata:
  projects_pgdata:
