[package]
name = "workbench-shared"
version = "0.1.0"
description = "Sync daemon supervision shared by the Workbench apps and the resident"
authors = ["Workbench Team"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "workbench_shared"
path = "src/lib.rs"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }
