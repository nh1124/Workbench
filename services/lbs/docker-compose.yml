services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: lbs_user
      POSTGRES_PASSWORD: lbs_password
      POSTGRES_DB: lbs_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lbs_user -d lbs_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build: .
    ports:
      - "${LBS_HOST_PORT:-8100}:${BACKEND_PORT:-8100}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LBS_ENV=${LBS_ENV:-dev}
      - LBS_BIND_HOST=0.0.0.0 # App inside container ALWAYS binds to all, Docker maps it
      - BACKEND_PORT=${BACKEND_PORT:-8100}

      - LBS_REQUIRE_API_KEY=${LBS_REQUIRE_API_KEY:-false}
      - LBS_DEFAULT_USER_ID=${LBS_DEFAULT_USER_ID}
      - LBS_ENABLE_DEV_HEADER_AUTH=${LBS_ENABLE_DEV_HEADER_AUTH:-false}
      - LBS_CORS_ALLOW_ORIGINS=${LBS_CORS_ALLOW_ORIGINS:-*}
      - LBS_SECRET_KEY=${LBS_SECRET_KEY:-your-secret-key-here}
      - ALGORITHM=${ALGORITHM:-HS256}
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
